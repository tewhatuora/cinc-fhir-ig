        content:
          application/json:
            schema:
              type: object
              properties:
                resourceType:
                  type: string
                  enum:
                    - Bundle
                type:
                  type: string
                  enum:
                    - transaction
                entry:
                  type: array
                  items:
                    type: object
                    properties:
                      resource:
                        type: object
                      request:
                        type: object
                        properties:
                          method:
                            type: string
                            enum:
